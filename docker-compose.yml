services:
  app:
    image: node:22
    working_dir: /workspace
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-development-secret-change-me
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pax
      INTERNAL_CRON_SECRET: local-development-secret-change-me
      FEATURE_ASSISTANT_RETRIEVAL: "false"
      FEATURE_REQUEST_METRICS: "true"
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: local
      R2_SECRET_ACCESS_KEY: local
      R2_BUCKET_NAME: startup-os-local
      R2_FORCE_PATH_STYLE: "true"
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
    command: >-
      sh -lc "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm db:migrate &&
      pnpm dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  # Drives the internal reminder endpoints every 15 minutes, mirroring the
  # Vercel/Cloudflare cron schedules. Requires INTERNAL_CRON_SECRET above.
  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: >-
      sh -c "while true; do
        curl -sf -H \"x-internal-secret: $$INTERNAL_CRON_SECRET\" http://app:3000/api/internal/reminders/enqueue-due >/dev/null || true;
        curl -sf -H \"x-internal-secret: $$INTERNAL_CRON_SECRET\" http://app:3000/api/internal/reminders/process >/dev/null || true;
        sleep 900;
      done"
    environment:
      INTERNAL_CRON_SECRET: local-development-secret-change-me
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 local local; do sleep 1; done &&
      mc mb --ignore-existing local/startup-os-local"

volumes:
  app_node_modules:
  postgres_data:
  minio_data:
