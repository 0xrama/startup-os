services:
  app:
    image: node:22
    working_dir: /workspace
    environment: &app-environment
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-development-secret-change-me
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pax
      INTERNAL_CRON_SECRET: local-development-secret-change-me
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Pax <pax@example.test>
      FEATURE_ASSISTANT_RETRIEVAL: "false"
      FEATURE_REQUEST_METRICS: "true"
      R2_ENDPOINT: http://minio:9000
      R2_PUBLIC_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: localadmin
      R2_SECRET_ACCESS_KEY: localadmin
      R2_BUCKET_NAME: startup-os-local
      R2_FORCE_PATH_STYLE: "true"
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
    # Avoid Turbopack refresh loops when the checkout is bind-mounted on macOS.
    command: >-
      sh -lc "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm db:migrate &&
      pnpm dev -- --webpack --disable-source-maps --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  worker:
    image: node:22
    working_dir: /workspace
    environment: *app-environment
    restart: unless-stopped
    init: true
    mem_limit: 512m
    stop_grace_period: 5m
    volumes:
      - .:/workspace:ro
      - app_node_modules:/workspace/node_modules:ro
    depends_on:
      - app
    command: >-
      sh -c "until test -f node_modules/tsx/package.json; do sleep 2; done;
      exec node --import tsx scripts/worker.ts"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: localadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 localadmin localadmin; do sleep 1; done &&
      mc mb --ignore-existing local/startup-os-local"

volumes:
  app_node_modules:
  postgres_data:
  minio_data:
