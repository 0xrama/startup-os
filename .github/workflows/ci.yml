name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run test:ci
      - run: npm run knip
      - run: npm run lint:duplicates
      - run: npm run lint:todo
      - run: npm run lint:large-files
      - run: npm run build
