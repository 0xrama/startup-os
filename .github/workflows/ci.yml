name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:oxlint
      - run: pnpm run format
      - run: pnpm run test:ci
      - run: pnpm run knip
      - run: pnpm run lint:duplicates
      - run: pnpm run lint:todo
      - run: pnpm run lint:large-files
      - run: pnpm run build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pax
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pax -d pax_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pax:test-only-password@localhost:5432/pax_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: build-only-placeholder-not-a-runtime-secret
      - run: pnpm test:browser
