name: Bug report
description: Report a broken flow or regression
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What broke?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
